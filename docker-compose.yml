version: '3.8'

services:
  analytics-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipld11-analytics-engine
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - ANALYTICS_TELEMETRY_DEFAULT_REPLAY_SPEED=BURST
    restart: unless-stopped
