server.port=8081
spring.application.name=ipl-d11-analytics-engine

# Telemetry streaming configuration
analytics.telemetry.default-fixture=classpath:telemetry/match_284_csk_vs_mi.ndjson
analytics.telemetry.default-replay-speed=BURST

# Columnar storage configuration
analytics.storage.base-path=./target/analytics-data
analytics.storage.duckdb.in-memory=true

# Knapsack solver limits
analytics.optimizer.max-solve-time-ms=50
analytics.optimizer.budget=100.0
